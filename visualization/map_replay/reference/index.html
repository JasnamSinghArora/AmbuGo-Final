<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AmbuGo — 20 seconds</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#222;font:16px/1.4 Arial,Helvetica,sans-serif}main{max-width:1500px;margin:auto;padding:18px 20px 32px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:16px}h1{font-size:23px;font-weight:600;margin:0}nav{display:flex;gap:8px}button{font:inherit;background:#fff;color:#222;border:1px solid #bbb;padding:8px 16px;cursor:pointer}button[aria-selected="true"]{border-color:#2869c5;color:#1859b5;border-bottom:3px solid #2869c5}video{width:100%;display:block;aspect-ratio:16/9;background:#fff}section[hidden]{display:none}.links{display:flex;gap:20px;margin-top:15px;font-size:15px}a{color:#245eaa}footer{font-size:13px;color:#666;margin-top:15px}@media(max-width:650px){main{padding:12px 8px}h1{font-size:18px}button{padding:7px 10px}header{gap:8px}}
</style></head><body><main><header><h1>AmbuGo · 20 seconds</h1><nav role="tablist" aria-label="Video"><button id="map-tab" role="tab" aria-selected="true" aria-controls="map-panel">Map</button><button id="graph-tab" role="tab" aria-selected="false" aria-controls="graph-panel">Animated graph</button></nav></header>
<section id="map-panel" role="tabpanel"><video id="map" controls muted poster="01_Poster.jpg" playsinline preload="auto" aria-label="20-second ambulance journey on Google Maps"><source src="01_Google_Maps_Journey.mp4" type="video/mp4"></video></section>
<section id="graph-panel" role="tabpanel" hidden><video id="graph" controls muted playsinline preload="auto" aria-label="20-second animated traffic progression"><source src="02_Progression.mp4" type="video/mp4"></video></section>

</main><script>
const map=document.getElementById('map'),graph=document.getElementById('graph');let active=map;
function show(which){const next=which==='map'?map:graph;if(next===active)return;const time=active.currentTime;const wasPlaying=!active.paused&&!active.ended;active.pause();const isMap=which==='map';document.getElementById('map-panel').hidden=!isMap;document.getElementById('graph-panel').hidden=isMap;document.getElementById('map-tab').setAttribute('aria-selected',isMap);document.getElementById('graph-tab').setAttribute('aria-selected',!isMap);active=next;const start=()=>{next.currentTime=Math.min(time,19.999);if(wasPlaying)next.play().catch(()=>{});};if(next.readyState>=1)start();else next.addEventListener('loadedmetadata',start,{once:true});}
document.getElementById('map-tab').onclick=()=>show('map');document.getElementById('graph-tab').onclick=()=>show('graph');
</script></body></html>
